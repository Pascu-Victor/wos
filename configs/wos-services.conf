# WOS PID 1 service manifest.
# The first non-comment entry is the version consumed by init.
version=1

[service journald]
user=journald
group=journald
supplementary-groups=none
umask=0077
authority-ceiling=16384
no-new-privileges=yes
service-privileges=journal-read
private-state=journal
exec=/sbin/journald
arg=/sbin/journald
type=daemon
class=journal
priority=10
environment=empty
readiness=immediate
readiness-timeout-ms=5000
restart=never
backoff-initial-ms=250
backoff-max-ms=30000
restart-budget=5
restart-window-ms=60000
stable-run-ms=60000
stop-term-ms=2000
stop-kill-ms=1000
drain-timeout-ms=2000
stdio=null
enable=always

[service dropbear-keygen]
user=keygen
group=keygen
supplementary-groups=none
umask=0077
authority-ceiling=0
no-new-privileges=yes
service-privileges=none
private-state=keygen
exec=/bin/dropbearkey
arg=/bin/dropbearkey
arg=-t
arg=rsa
arg=-f
arg=/etc/dropbear/dropbear_rsa_host_key
depends=journald
type=oneshot
class=normal
priority=0
environment=empty
readiness=exit-success
readiness-timeout-ms=30000
restart=on-failure
backoff-initial-ms=250
backoff-max-ms=30000
restart-budget=5
restart-window-ms=60000
stable-run-ms=60000
stop-term-ms=2000
stop-kill-ms=1000
drain-timeout-ms=2000
stdio=journal
enable=path-missing
enable-path=/etc/dropbear/dropbear_rsa_host_key

[service netd]
user=netd
group=netd
supplementary-groups=none
umask=0077
authority-ceiling=4096
no-new-privileges=yes
service-privileges=network-admin
runtime-state=netd
exec=/sbin/netd
arg=/sbin/netd
depends=journald
type=daemon
class=network-provider
priority=0
environment=empty
# Init's bounded network probe treats this legacy token as IPv4-or-usable-global-IPv6;
# tentative, DAD-failed, loopback, and link-local-only IPv6 state is not ready.
readiness=ipv4
readiness-interface=eth0
readiness-timeout-ms=180000
restart=on-failure
backoff-initial-ms=250
backoff-max-ms=30000
restart-budget=5
restart-window-ms=60000
stable-run-ms=60000
stop-term-ms=2000
stop-kill-ms=1000
drain-timeout-ms=2000
stdio=null
enable=always

[service httpd]
user=httpd
group=httpd
supplementary-groups=none
umask=0077
authority-ceiling=0
no-new-privileges=yes
service-privileges=none
exec=/sbin/httpd
arg=/sbin/httpd
depends=netd
type=daemon
class=network-consumer
priority=10
environment=empty
readiness=immediate
readiness-timeout-ms=5000
restart=on-failure
backoff-initial-ms=250
backoff-max-ms=30000
restart-budget=5
restart-window-ms=60000
stable-run-ms=60000
stop-term-ms=2000
stop-kill-ms=1000
drain-timeout-ms=2000
stdio=null
enable=always

[service dropbear]
user=root
group=root
supplementary-groups=none
umask=0022
authority-ceiling=65535
no-new-privileges=no
service-privileges=none
exec=/bin/dropbear
arg=/bin/dropbear
arg=-r
arg=/etc/dropbear/dropbear_rsa_host_key
arg=-F
depends=netd
depends=dropbear-keygen
type=daemon
class=network-consumer
priority=-5
environment=init
readiness=immediate
readiness-timeout-ms=5000
restart=on-failure
backoff-initial-ms=250
backoff-max-ms=30000
restart-budget=5
restart-window-ms=60000
stable-run-ms=60000
stop-term-ms=2000
stop-kill-ms=1000
drain-timeout-ms=2000
stdio=journal
enable=always

[service testd]
user=root
group=root
supplementary-groups=none
umask=0022
authority-ceiling=65535
no-new-privileges=no
service-privileges=none
exec=/usr/bin/testd
arg=/usr/bin/testd
depends=netd
depends=httpd
depends=dropbear
type=oneshot
class=normal
priority=0
environment=init
readiness=exit-success
readiness-timeout-ms=5000
restart=never
backoff-initial-ms=250
backoff-max-ms=30000
restart-budget=5
restart-window-ms=60000
stable-run-ms=60000
stop-term-ms=2000
stop-kill-ms=1000
drain-timeout-ms=2000
stdio=inherit
enable=disabled
