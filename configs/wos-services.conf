# WOS PID 1 service manifest.
# The first non-comment entry is the version consumed by init.
version=1

[service journald]
exec=/sbin/journald
arg=/sbin/journald
type=daemon
class=journal
priority=10
environment=init
readiness=immediate
readiness-timeout-ms=5000
restart=never
backoff-initial-ms=250
backoff-max-ms=30000
restart-budget=5
restart-window-ms=60000
stable-run-ms=60000
stop-term-ms=2000
stop-kill-ms=1000
drain-timeout-ms=2000
stdio=inherit
enable=always

[service dropbear-keygen]
exec=/bin/dropbearkey
arg=/bin/dropbearkey
arg=-t
arg=rsa
arg=-f
arg=/etc/dropbear/dropbear_rsa_host_key
depends=journald
type=oneshot
class=normal
priority=0
environment=init
readiness=exit-success
readiness-timeout-ms=30000
restart=on-failure
backoff-initial-ms=250
backoff-max-ms=30000
restart-budget=5
restart-window-ms=60000
stable-run-ms=60000
stop-term-ms=2000
stop-kill-ms=1000
drain-timeout-ms=2000
stdio=journal
enable=path-missing
enable-path=/etc/dropbear/dropbear_rsa_host_key

[service netd]
exec=/sbin/netd
arg=/sbin/netd
depends=journald
type=daemon
class=network-provider
priority=0
environment=init
readiness=ipv4
readiness-interface=eth0
readiness-timeout-ms=180000
restart=on-failure
backoff-initial-ms=250
backoff-max-ms=30000
restart-budget=5
restart-window-ms=60000
stable-run-ms=60000
stop-term-ms=2000
stop-kill-ms=1000
drain-timeout-ms=2000
stdio=inherit
enable=always

[service httpd]
exec=/sbin/httpd
arg=/sbin/httpd
depends=netd
type=daemon
class=network-consumer
priority=10
environment=init
readiness=immediate
readiness-timeout-ms=5000
restart=on-failure
backoff-initial-ms=250
backoff-max-ms=30000
restart-budget=5
restart-window-ms=60000
stable-run-ms=60000
stop-term-ms=2000
stop-kill-ms=1000
drain-timeout-ms=2000
stdio=inherit
enable=always

[service dropbear]
exec=/bin/dropbear
arg=/bin/dropbear
arg=-r
arg=/etc/dropbear/dropbear_rsa_host_key
arg=-F
depends=netd
depends=dropbear-keygen
type=daemon
class=network-consumer
priority=-5
environment=init
readiness=immediate
readiness-timeout-ms=5000
restart=on-failure
backoff-initial-ms=250
backoff-max-ms=30000
restart-budget=5
restart-window-ms=60000
stable-run-ms=60000
stop-term-ms=2000
stop-kill-ms=1000
drain-timeout-ms=2000
stdio=journal
enable=always

[service testd]
exec=/usr/bin/testd
arg=/usr/bin/testd
depends=netd
depends=httpd
depends=dropbear
type=oneshot
class=normal
priority=0
environment=init
readiness=exit-success
readiness-timeout-ms=5000
restart=never
backoff-initial-ms=250
backoff-max-ms=30000
restart-budget=5
restart-window-ms=60000
stable-run-ms=60000
stop-term-ms=2000
stop-kill-ms=1000
drain-timeout-ms=2000
stdio=inherit
enable=disabled
