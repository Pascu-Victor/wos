# Timeout in seconds that Limine will use before automatically booting.
timeout: 0

# The entry name that will be displayed in the boot menu.
/wos
    # We use the Limine boot protocol.
    protocol: limine

    # Randomize the relocatable kernel by default.
    kaslr: yes
    # Kernel-image KASLR is independent of the established WOS direct-map
    # aperture. Keep that ABI stable for allocator/debug validation.
    randomise_hhdm_base: no

    # Path to the kernel to boot. boot:/// represents the partition on which limine.conf is located.
    kernel_path: boot():/wos
    # Path to the CPIO initramfs (contains /sbin/init + /etc/fstab).
    module_path: boot():/initramfs.cpio

    cmdline: --selftest

# Deterministic test-only rollback entry. Protection reporting must still
# report the exact fixed load base rather than claiming randomization.
/wos (deterministic no KASLR)
    protocol: limine
    kaslr: no
    randomise_hhdm_base: no
    kernel_path: boot():/wos
    module_path: boot():/initramfs.cpio
    cmdline: --selftest
